name: Manual Python checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare Python dependencies
        run: uv sync
      - name: Offline provider tests
        run: uv run python -m unittest discover -s tests -v
      - name: Syntax check
        run: uv run python -m compileall -q pons_cli server
